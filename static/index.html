<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeStream</title>
  <style>
    :root { color-scheme: dark; --bg:#0a0a0c; --surface:#141418; --border:#2a2a32; --text:#f5f5f7; --muted:#9a9aa8; --accent:#3b82f6; --include:#22c55e; --exclude:#ef4444; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui,sans-serif; background:var(--bg); color:var(--text); }
    header { padding:1rem 1.25rem; display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; }
    h1 { margin:0; font-size:1.2rem; }
    .spacer { flex:1; }
    button, input, select { font:inherit; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:.4rem .6rem; }
    button { cursor:pointer; }
    #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:.75rem; padding:1rem; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:8px; overflow:hidden; cursor:pointer; transition: border-color .15s; }
    .card:hover { border-color: var(--accent); }
    .card img { width:100%; aspect-ratio:2/3; object-fit:cover; background:#222; display:block; }
    .card .meta { padding:.5rem; font-size:.8rem; }
    .badge { font-size:.65rem; opacity:.8; }
    #status { padding:0 1.25rem; color:var(--muted); font-size:.85rem; min-height:1.2rem; }
    #status.error { color: #f87171; }
    .filters { padding:0 1.25rem 1rem; display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
    .genre-chip { border-radius:999px; padding:.25rem .55rem; font-size:.75rem; border:1px solid var(--border); background:var(--surface); }
    .genre-chip.include { border-color: var(--include); color: var(--include); }
    .genre-chip.exclude { border-color: var(--exclude); color: var(--exclude); text-decoration: line-through; }
    .section-title { padding:0 1.25rem; font-size:.85rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
    #continue { display:flex; gap:.75rem; overflow-x:auto; padding:0 1rem 1rem; }
    .cw-card { min-width:180px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:.5rem; cursor:pointer; font-size:.8rem; }
    .cw-card img { width:48px; height:72px; object-fit:cover; border-radius:4px; float:left; margin-right:.5rem; }
  </style>
</head>
<body>
  <header>
    <h1>FreeStream</h1>
    <div class="spacer"></div>
    <input id="search" placeholder="Search movies and TV…" />
    <select id="type"><option value="ALL">All</option><option value="MOVIE">Movies</option><option value="TV">TV</option></select>
    <input id="minScore" type="number" min="0" max="10" step="0.5" placeholder="Min IMDb" style="width:5rem" />
    <input id="minYear" type="number" placeholder="Year" style="width:5rem" />
    <button id="apply">Apply</button>
  </header>
  <div class="filters" id="genreBar"></div>
  <div id="status"></div>
  <div class="section-title" id="cwLabel" style="display:none">Continue Watching</div>
  <div id="continue"></div>
  <div id="grid"></div>
  <script>
    const grid = document.getElementById('grid');
    const status = document.getElementById('status');
    const genreBar = document.getElementById('genreBar');
    const continueRow = document.getElementById('continue');
    const cwLabel = document.getElementById('cwLabel');
    const genreModes = new Map();
    let allGenres = [];
    let page = 1;

    function setStatus(msg, isError=false) {
      status.textContent = msg;
      status.className = isError ? 'error' : '';
    }

    function cycleGenre(genre) {
      const cur = genreModes.get(genre) || 'neutral';
      const next = cur === 'neutral' ? 'include' : cur === 'include' ? 'exclude' : 'neutral';
      if (next === 'neutral') genreModes.delete(genre);
      else genreModes.set(genre, next);
      renderGenreChips();
      loadTitles(true);
    }

    function renderGenreChips() {
      genreBar.innerHTML = '';
      if (!allGenres.length) return;
      const label = document.createElement('span');
      label.textContent = 'Genres (click: include → exclude → off):';
      label.style.color = 'var(--muted)';
      label.style.fontSize = '.8rem';
      genreBar.appendChild(label);
      for (const g of allGenres.slice(0, 24)) {
        const btn = document.createElement('button');
        const mode = genreModes.get(g) || 'neutral';
        btn.className = 'genre-chip' + (mode !== 'neutral' ? ' ' + mode : '');
        btn.textContent = mode === 'include' ? '+ ' + g : mode === 'exclude' ? '− ' + g : g;
        btn.onclick = () => cycleGenre(g);
        genreBar.appendChild(btn);
      }
    }

    async function loadGenres() {
      const res = await fetch('/api/genres');
      const data = await res.json();
      allGenres = data.genres || [];
      renderGenreChips();
    }

    function genreParams(params) {
      const include = [...genreModes.entries()].filter(([,m]) => m === 'include').map(([g]) => g);
      const exclude = [...genreModes.entries()].filter(([,m]) => m === 'exclude').map(([g]) => g);
      for (const g of include) params.append('genres', g);
      for (const g of exclude) params.append('exclude_genres', g);
    }

    async function loadContinue() {
      const res = await fetch('/api/watch/continue');
      const data = await res.json();
      continueRow.innerHTML = '';
      if (!data.rows?.length) {
        cwLabel.style.display = 'none';
        return;
      }
      cwLabel.style.display = 'block';
      for (const row of data.rows) {
        const card = document.createElement('div');
        card.className = 'cw-card';
        if (row.posterUrl) {
          const img = document.createElement('img');
          img.src = row.posterUrl;
          img.alt = row.seriesTitle;
          card.appendChild(img);
        }
        const pct = row.durationMs > 0 ? Math.round(100 * row.positionMs / row.durationMs) : 0;
        const text = document.createElement('div');
        text.innerHTML = `<strong>${row.seriesTitle}</strong><br>${row.episodeTitle}<br>${pct}% watched`;
        card.appendChild(text);
        const rowData = { title: row.seriesTitle, imdbId: '', mediaType: 'TV', year: null, poster: row.posterUrl };
        card.onclick = () => playTitle(rowData);
        continueRow.appendChild(card);
      }
    }

    async function loadTitles(reset=true) {
      if (reset) { page = 1; grid.innerHTML = ''; }
      const params = new URLSearchParams({ page, page_size: 60, sort: 'imdb_rating', order: 'desc' });
      const q = document.getElementById('search').value.trim();
      const type = document.getElementById('type').value;
      const minScore = document.getElementById('minScore').value;
      const minYear = document.getElementById('minYear').value;
      if (q) params.set('search', q);
      if (type && type !== 'ALL') params.set('type', type);
      if (minScore) params.set('min_score', minScore);
      if (minYear) params.set('min_year', minYear);
      genreParams(params);
      const res = await fetch('/api/titles?' + params);
      const data = await res.json();
      setStatus(data.catalog_ready
        ? `${data.total} titles · page ${data.page}/${data.pages}`
        : 'Catalog not ready — run fetch + prepare pipeline');
      for (const row of data.rows) {
        const card = document.createElement('div');
        card.className = 'card';
        const img = document.createElement('img');
        img.src = row.poster || row.fallbackImage || '';
        img.alt = row.title;
        img.onerror = () => { if (row.fallbackImage && img.src !== row.fallbackImage) img.src = row.fallbackImage; };
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.innerHTML = `<div>${row.title}</div><div class="badge">${row.mediaType} · ${row.imdbRating?.toFixed(1) ?? '—'} · ${row.year ?? ''}</div>`;
        card.appendChild(img);
        card.appendChild(meta);
        card.onclick = () => playTitle(row);
        grid.appendChild(card);
      }
    }

    async function playTitle(row) {
      setStatus(`Resolving ${row.title}…`);
      const imdb = row.imdbId || 'tt0000000';
      const mediaType = (row.mediaType || 'movie').toLowerCase();
      const qs = new URLSearchParams({
        imdb_id: imdb,
        title: row.title,
        media_type: mediaType,
      });
      if (row.year) qs.set('year', String(row.year));
      try {
        const res = await fetch('/api/stream/resolve?' + qs);
        const data = await res.json();
        const stream = data.streams?.[0];
        if (!stream?.streamUrl) throw new Error('No stream URL returned');
        setStatus(`Launching VLC for ${row.title}…`);
        const playRes = await fetch('/api/stream/play', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            streamUrl: stream.streamUrl,
            quality: stream.quality,
            headers: stream.headers,
            title: row.title,
            provider: stream.provider,
            sourceUrl: stream.sourceUrl,
          }),
        });
        const playData = await playRes.json();
        if (!playData.ok) throw new Error(playData.error || 'Play failed');
        setStatus(`Playing ${row.title} (${stream.quality})`);
        await fetch('/api/watch/progress', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            episodeUrl: stream.sourceUrl || stream.streamUrl,
            seriesTitle: row.title,
            episodeTitle: row.title,
            posterUrl: row.poster || row.fallbackImage || '',
            positionMs: 0,
            durationMs: 1,
          }),
        });
        loadContinue();
      } catch (err) {
        setStatus(`Play error: ${err.message}`, true);
      }
    }

    document.getElementById('apply').onclick = () => loadTitles(true);
    document.getElementById('search').onkeydown = e => { if (e.key === 'Enter') loadTitles(true); };
    loadGenres();
    loadContinue();
    loadTitles(true);
  </script>
</body>
</html>
