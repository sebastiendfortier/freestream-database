name: Build Windows MSI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Checkout freestream-resolver
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/freestream-resolver
          path: freestream-resolver

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
          wix eula accept wix7

      - name: Install build dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor/wheels | Out-Null
          uv build freestream-resolver --wheel --out-dir vendor/wheels
          $wheel = Get-ChildItem vendor/wheels/freestream_resolver*.whl | Select-Object -First 1
          if (-not $wheel) { throw "freestream-resolver wheel not built" }
          $wheelRel = "vendor/wheels/$($wheel.Name)"
          @"

          [tool.uv.sources]
          freestream-resolver = { path = "$wheelRel" }
          "@ | Add-Content -Path pyproject.toml -Encoding utf8
          uv lock
          uv sync --group dev

      - name: Build Windows MSI
        run: uv run pyappdist build windows

      - name: Collect MSI artifact
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Recurse -Path appdist -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) { $msi = Get-ChildItem -Recurse -Filter *.msi | Select-Object -First 1 }
          if (-not $msi) { throw "MSI not found" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $msi.FullName dist/freestream-database-windows-x64.msi

      - uses: actions/upload-artifact@v4
        with:
          name: freestream-database-windows-msi
          path: dist/*.msi
